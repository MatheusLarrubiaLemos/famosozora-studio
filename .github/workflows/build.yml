# Monta o instalador do FamosoZora Studio e publica em "Releases".
# Roda a cada Push na main, mas so monta quando a versao em app/versao.py ainda nao tem Release.
# ANTES, roda os testes automaticos (numa maquina separada): se algum falhar, a versao NAO sai.
# Num pull request para a main, so roda os testes (para ver se esta tudo certo antes de juntar).
# Tambem da pra rodar na mao: aba Actions -> "Build do app" -> Run workflow.
name: Build do app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    # maquina separada: as ferramentas de teste nao entram no Python que vai dentro do instalador
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar as bibliotecas
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Conferir o codigo (ruff)
        shell: pwsh
        run: python -m ruff check app testes

      - name: Rodar os testes (se algum falhar, a versao nao sai)
        shell: pwsh
        run: python -m pytest -q

  build:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ler a versao
        id: v
        shell: pwsh
        run: |
          $v = (python build/ler_versao.py).Trim()
          "versao=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { "existe=sim" >> $env:GITHUB_OUTPUT } else { "existe=nao" >> $env:GITHUB_OUTPUT }
          Write-Host "Versao $v"
          exit 0

      - name: Ja existe Release desta versao
        if: steps.v.outputs.existe == 'sim'
        shell: pwsh
        run: Write-Host "A versao ${{ steps.v.outputs.versao }} ja foi publicada. Para um instalador novo, aumente o numero em app/versao.py e escreva no CHANGELOG.md."

      - name: Conferir o patch notes
        if: steps.v.outputs.existe == 'nao'
        shell: pwsh
        run: python build/notas_da_versao.py ${{ steps.v.outputs.versao }} > notas.md

      - name: Montar o app
        if: steps.v.outputs.existe == 'nao'
        shell: pwsh
        run: ./build/montar_app.ps1

      - name: Criar o instalador
        if: steps.v.outputs.existe == 'nao'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DVersao=${{ steps.v.outputs.versao }} build/instalador.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist/*.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Publicar o Release
        if: steps.v.outputs.existe == 'nao'
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.versao }}"
          gh release create "v$v" "dist/FamosoZora-Studio-Setup-$v.exe" --title "FamosoZora Studio $v" --notes-file notas.md --target "${{ github.sha }}"
